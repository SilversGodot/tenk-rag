# ---- Corpus -------------------------------------------------------------
corpus:
  # SEC requires a User-Agent with your name and email. Replace this.
  user_agent: "Neal Huang huangtzuchao@gmail.com"
  tickers: [AAPL, MSFT, NVDA, AMZN, JPM, XOM, JNJ, WMT, KO, CVX]
  filings_per_company: 3          # most recent N 10-Ks
  raw_dir: data/raw
  parsed_dir: data/parsed

# ---- Models -------------------------------------------------------------
models:
  embedding: BAAI/bge-small-en-v1.5   # small, fast, runs on CPU
  reranker: BAAI/bge-reranker-base    # cross-encoder, used when rerank: true
  llm: claude-sonnet-5-5              # answers + LLM judge (needs ANTHROPIC_API_KEY)

# ---- Defaults for an index / pipeline ------------------------------------
defaults:
  chunk_strategy: section     # "fixed" or "section"
  chunk_size: 400             # in words (~1.3 tokens per word)
  chunk_overlap: 50
  retrieval: hybrid           # "vector", "bm25", or "hybrid"
  top_k: 5
  candidates: 30              # pool size before fusion / reranking
  rerank: false
  use_filters: true           # restrict search to the question's ticker + year

# ---- Experiments ---------------------------------------------------------
# Each entry overrides the defaults. Run one with:
#   python -m tenk_rag.cli eval --experiment <name>
experiments:
  baseline_vector:      {retrieval: vector, rerank: false}
  bm25_only:            {retrieval: bm25, rerank: false}
  hybrid:               {retrieval: hybrid, rerank: false}
  hybrid_rerank:        {retrieval: hybrid, rerank: true}
  hybrid_no_filters:    {retrieval: hybrid, use_filters: false}
  fixed_256:            {chunk_strategy: fixed, chunk_size: 256, chunk_overlap: 32}
  fixed_512:            {chunk_strategy: fixed, chunk_size: 512, chunk_overlap: 64}
  section_800:          {chunk_strategy: section, chunk_size: 800, chunk_overlap: 80}
  top_k_10:             {top_k: 10}
