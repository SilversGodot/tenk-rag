[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenk-rag"
version = "0.1.0"
description = "Retrieval-augmented question answering over SEC 10-K filings, with an evaluation harness"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
